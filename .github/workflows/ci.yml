name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: JSON is valid
        run: for f in .claude-plugin/*.json hooks/hooks.json templates/home/factory.json; do python3 -m json.tool "$f" > /dev/null; done
      - name: Python compiles
        run: python3 -m py_compile hooks/guard.py bin/factory-run bin/factory-usage
      - name: Generic privacy check
        run: sh scripts/privacy-check.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
